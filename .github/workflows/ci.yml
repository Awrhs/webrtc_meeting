name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # 真实 Postgres / Redis：repository、service、db 包的集成测试依赖它们
    # （未设置 TEST_DATABASE_DSN / TEST_REDIS_ADDR 时这些测试自动跳过）
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: host=localhost port=5432 user=postgres password=postgres sslmode=disable
      TEST_REDIS_ADDR: localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l backend tools)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            gofmt -d $UNFORMATTED
            exit 1
          fi

      - name: Vet backend
        run: go vet ./...

      - name: Test backend (race detector, with Postgres/Redis integration tests)
        run: go test -race ./...

      - name: Build backend
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  e2e:
    name: Cross-browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend

      - name: "Run smoke E2E (full meeting suite needs backend stack: E2E_FULL=1)"
        run: npx playwright test
        working-directory: frontend

  e2e-full:
    name: Full meeting E2E (Chromium, real backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conference
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GO_ENV: development
      SERVER_PORT: "8080"
      SFU_PORT: "8081"
      SFU_GRPC_PORT: "50051"
      SFU_ADDR: localhost:50051
      API_SERVER_HOST: http://localhost:8080
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: conference
      REDIS_ADDR: localhost:6379
      JWT_SECRET: e2e-only-jwt-secret-not-for-production-0123456789
      SFU_JWT_SECRET: e2e-only-sfu-secret-not-for-production-0123456789
      SFU_CONTROL_TOKEN: e2e-control-token
      SFU_CALLBACK_TOKEN: e2e-callback-token
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SFU_PUBLIC_WS_URL: ws://localhost:8081
      # runner 到公网 STUN 不稳定会让 SFU 每次入会白等 5 秒；浏览器与 SFU 同机，host 候选足够
      STUN_URLS: none
      # 两个用户各注册+登录，默认 5 次/分钟的认证限流太紧
      RATE_LIMIT_AUTH_PER_MINUTE: "100"
      RATE_LIMIT_SFU_WS_PER_MINUTE: "100"
      PRESENCE_GRACE_SECONDS: "5"
      VITE_API_HOST: http://localhost:8080
      VITE_SFU_HOST: http://localhost:8081
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend binaries
        run: |
          go build -o bin/server ./backend/cmd/server
          go build -o bin/sfu ./backend/cmd/sfu

      - name: Start SFU and API servers
        run: |
          nohup ./bin/sfu > sfu.log 2>&1 &
          nohup ./bin/server > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/readyz > /dev/null && curl -sf http://localhost:8081/healthz > /dev/null; then
              echo "backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready"; cat server.log sfu.log; exit 1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (pointing at local backend)
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run full meeting E2E
        run: E2E_FULL=1 npx playwright test --project=chromium
        working-directory: frontend

      - name: Upload backend logs and Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-diagnostics
          path: |
            server.log
            sfu.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
