# 前端容器内的 nginx 配置（Dockerfile.frontend 复制为 /etc/nginx/conf.d/default.conf）。
#
# 要点：
#  - SPA 路由回退：/meeting/123 这类前端路由在刷新或直接打开时返回 index.html，而不是 404
#  - /assets/ 下的构建产物文件名带内容 hash，允许浏览器长期缓存
#  - index.html 与 sw.js 禁止缓存（no-cache = 每次重新校验），保证发布后立即生效
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
