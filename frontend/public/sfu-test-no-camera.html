<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFU 无摄像头测试页面</title>
    <style>
        /* 全局重置：消除浏览器默认边距和填充，统一盒模型 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 页面主体样式：深色科技风背景，全屏最小高度，内边距 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        /* 内容容器：限制最大宽度并居中 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* 页面标题：青色高亮 */
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        /* 状态面板：展示各环节连接状态的卡片区域 */
        .status-panel {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        /* 单行状态项：标签 + 状态点 + 文字 */
        .status-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        /* 状态标签固定宽度，保持对齐 */
        .status-label {
            width: 120px;
            font-weight: 500;
        }
        /* 状态指示圆点 */
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        /* 三种状态颜色：待处理(黄)、成功(绿)、错误(红) */
        .status-dot.pending { background: #f39c12; }
        .status-dot.success { background: #27ae60; }
        .status-dot.error { background: #e74c3c; }
        /* 控制按钮区域：弹性布局，自动换行 */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        /* 统一按钮样式 */
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* 按钮配色方案 */
        .btn-primary { background: #00d4ff; color: #1a1a2e; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #27ae60; color: white; }
        /* 输入框分组：房间ID、用户ID、SFU地址 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        /* 输入框统一样式 */
        input {
            padding: 10px 15px;
            border: 2px solid #0f3460;
            border-radius: 6px;
            background: #16213e;
            color: white;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        /* 视频网格：响应式布局，每个视频至少400px宽 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        /* 单个视频容器 */
        .video-container {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
        }
        .video-container h3 {
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }
        /* video 标签：保持16:9比例，覆盖裁剪 */
        video {
            width: 100%;
            background: #000;
            border-radius: 4px;
            aspect-ratio: 16/9;
            object-fit: cover;
        }
        /* 日志面板：等宽字体，滚动区域 */
        .logs {
            background: #0f0f23;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        /* 单行日志条目 */
        .log-entry {
            margin: 4px 0;
            padding: 4px 8px;
            border-radius: 4px;
        }
        /* 日志级别配色 */
        .log-info { background: rgba(0, 212, 255, 0.1); color: #00d4ff; }
        .log-success { background: rgba(39, 174, 96, 0.1); color: #27ae60; }
        .log-error { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .log-warn { background: rgba(243, 156, 18, 0.1); color: #f39c18; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 SFU 无摄像头功能测试</h1>

        <!-- 状态面板：实时展示 WebRTC 各阶段的连接状态 -->
        <div class="status-panel">
            <div class="status-item">
                <span class="status-label">模拟媒体：</span>
                <span id="media-status" class="status-dot pending"></span>
                <span id="media-text">等待生成</span>
            </div>
            <div class="status-item">
                <span class="status-label">SDP Offer：</span>
                <span id="offer-status" class="status-dot pending"></span>
                <span id="offer-text">未发送</span>
            </div>
            <div class="status-item">
                <span class="status-label">SDP Answer：</span>
                <span id="answer-status" class="status-dot pending"></span>
                <span id="answer-text">未接收</span>
            </div>
            <div class="status-item">
                <span class="status-label">ICE连接：</span>
                <span id="ice-status" class="status-dot pending"></span>
                <span id="ice-text">未连接</span>
            </div>
            <div class="status-item">
                <span class="status-label">媒体流转发：</span>
                <span id="stream-status" class="status-dot pending"></span>
                <span id="stream-text">等待中...</span>
            </div>
        </div>

        <!-- 输入参数区域：房间ID、用户ID、SFU服务器地址 -->
        <div class="input-group">
            <input type="number" id="room-id" value="1" placeholder="房间ID">
            <input type="number" id="user-id" value="1" placeholder="用户ID">
            <!-- SFU地址默认指向本地WSL2/Docker环境，实际使用时替换为真实IP -->
            <input type="text" id="sfu-url" value="http://localhost:8081" placeholder="SFU地址" style="flex: 1;">
        </div>

        <!-- 操作按钮：按顺序执行 -->
        <div class="controls">
            <button id="btn-media" class="btn-primary" onclick="startMedia()">1. 生成模拟媒体流</button>
            <button id="btn-connect" class="btn-success" onclick="connectToSFU()" disabled>2. 连接SFU</button>
            <button id="btn-disconnect" class="btn-danger" onclick="disconnect()" disabled>断开连接</button>
        </div>

        <!-- 视频展示区域：本地模拟视频 + SFU转发回来的远程流 -->
        <div class="video-grid">
            <div class="video-container">
                <h3>📹 本地模拟视频 (Canvas生成)</h3>
                <!-- autoplay muted playsinline 确保移动端自动播放且不产生回声 -->
                <video id="local-video" autoplay muted playsinline></video>
            </div>
            <div class="video-container">
                <h3>🌐 远程视频 (来自SFU)</h3>
                <!-- 远程视频不需要muted（我们要听到对方声音），但需要autoplay -->
                <video id="remote-video" autoplay playsinline></video>
            </div>
        </div>

        <!-- 实时日志输出面板 -->
        <div class="logs" id="logs"></div>
    </div>

    <script>
        // ============================================================
        // 全局状态管理
        // ============================================================
        let localStream = null;      // 本地模拟媒体流（Canvas视频 + 静音音频）
        let peerConnection = null;   // RTCPeerConnection 实例，负责与SFU的WebRTC连接
        let remoteStream = new MediaStream(); // 聚合所有远程轨道的 MediaStream
        let sfuWs = null;            // 与SFU服务器建立的 WebSocket 连接（信令通道）
        let simCanvas = null;        // 用于生成模拟视频的 Canvas 元素
        let simCtx = null;           // Canvas 2D 上下文
        let animationId = null;      // requestAnimationFrame 动画 ID，用于停止动画
        let audioCtx = null;         // AudioContext，用于生成静音音频轨道
        let audioOsc = null;         // OscillatorNode，静音音频源

        // DOM 元素缓存，避免反复查询
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const btnConnect = document.getElementById('btn-connect');
        const btnDisconnect = document.getElementById('btn-disconnect');

        // ============================================================
        // 工具函数
        // ============================================================

        /**
         * 向日志面板追加一条带时间戳的消息
         * @param {string} message - 日志内容
         * @param {string} type - 日志级别：info/success/error/warn
         */
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        /**
         * 更新状态面板中的某一项
         * @param {string} id - 状态项前缀（如 media/offer/answer/ice/stream）
         * @param {string} status - 状态类名：pending/success/error
         * @param {string} text - 状态描述文字
         */
        function updateStatus(id, status, text) {
            const dot = document.getElementById(`${id}-status`);
            const textEl = document.getElementById(`${id}-text`);
            dot.className = `status-dot ${status}`;
            textEl.textContent = text;
        }

        // ============================================================
        // WebRTC ICE 服务器配置
        // ============================================================

        // 基础 RTC 配置：仅包含 Google 公共 STUN 服务器
        let rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        };

        /**
         * 构建 ICE 服务器配置
         * 本地开发环境使用公共 STUN 即可，无需 TURN
         *
         * @param {string} sfuUrl - SFU HTTP 地址，如 http://localhost:8081
         * @returns {object} RTCConfiguration 对象
         */
        function buildRtcConfig(sfuUrl) {
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            };
            log('ICE服务器配置: STUN=stun:stun.l.google.com:19302');
            return config;
        }

        // ============================================================
        // 全局错误捕获
        // 将浏览器控制台的未捕获错误显示在页面日志中，方便移动端/WSL2环境调试
        // ============================================================
        window.onerror = (message, source, lineno, colno, error) => {
            log(`JS错误: ${message} (行${lineno})`, 'error');
            return false;
        };
        window.onunhandledrejection = (event) => {
            log(`未处理的Promise拒绝: ${event.reason}`, 'error');
        };

        // ============================================================
        // 步骤 1：生成模拟媒体流（Canvas 动态动画 + 静音音频）
        // ============================================================
        /**
         * 无需真实摄像头/麦克风，使用 Canvas 生成动态彩色动画视频流，
         * 并创建一个静音音频轨道，使 SDP 协商结构与真实媒体场景一致。
         * 成功后将流绑定到 local-video 元素，并启用"连接SFU"按钮。
         */
        async function startMedia() {
            try {
                log('正在生成模拟媒体流（无需摄像头）...');

                // ---------- 创建 Canvas 模拟视频 ----------
                simCanvas = document.createElement('canvas');
                simCanvas.width = 640;
                simCanvas.height = 480;
                simCtx = simCanvas.getContext('2d');

                // 启动动画循环：绘制动态彩色条带 + 时间戳
                let frameCount = 0;
                function drawFrame() {
                    if (!simCtx) return;
                    const time = Date.now() / 1000;
                    const w = simCanvas.width;
                    const h = simCanvas.height;

                    // 动态背景：随时间滚动的彩色条带
                    const barHeight = 40;
                    for (let y = 0; y < h; y += barHeight) {
                        const hue = ((y + time * 60) % 360);
                        simCtx.fillStyle = `hsl(${hue}, 75%, 45%)`;
                        simCtx.fillRect(0, y, w, barHeight);
                    }

                    // 中心信息面板
                    simCtx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    simCtx.fillRect(40, h / 2 - 60, w - 80, 120);
                    simCtx.strokeStyle = '#00d4ff';
                    simCtx.lineWidth = 2;
                    simCtx.strokeRect(40, h / 2 - 60, w - 80, 120);

                    // 时间戳文字
                    simCtx.fillStyle = '#ffffff';
                    simCtx.font = 'bold 28px monospace';
                    simCtx.textAlign = 'center';
                    simCtx.fillText(new Date().toLocaleTimeString(), w / 2, h / 2 - 10);

                    // 帧计数和提示文字
                    simCtx.font = '18px monospace';
                    simCtx.fillStyle = '#00d4ff';
                    simCtx.fillText(`模拟视频流 | 帧: ${frameCount++}`, w / 2, h / 2 + 25);
                    simCtx.fillText('无摄像头模式', w / 2, h / 2 + 50);

                    animationId = requestAnimationFrame(drawFrame);
                }
                drawFrame();

                // 从 Canvas 捕获视频流（30fps）
                const canvasStream = simCanvas.captureStream(30);
                const videoTrack = canvasStream.getVideoTracks()[0];
                log('Canvas 模拟视频轨道已创建', 'success');

                // ---------- 创建静音音频轨道 ----------
                // 使用 AudioContext 生成一个频率为 0 的振荡器（完全静音），
                // 这样 SDP Offer 中会包含音频 m-line，与真实场景更一致。
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audioOsc = audioCtx.createOscillator();
                audioOsc.frequency.value = 0; // 静音
                const audioDest = audioCtx.createMediaStreamDestination();
                audioOsc.connect(audioDest);
                audioOsc.start();
                const audioTrack = audioDest.stream.getAudioTracks()[0];
                log('静音音频轨道已创建', 'success');

                // 合并视频和音频轨道为一个 MediaStream
                localStream = new MediaStream([videoTrack, audioTrack]);

                // 将获取到的本地流绑定到视频标签
                localVideo.srcObject = localStream;

                log('模拟媒体流生成成功！', 'success');
                updateStatus('media', 'success', '已生成 (Canvas+静音)');

                // 只有生成模拟媒体后，才允许进行下一步连接
                btnConnect.disabled = false;

            } catch (error) {
                log(`生成模拟媒体失败: ${error.message}`, 'error');
                updateStatus('media', 'error', '失败');
            }
        }

        // ============================================================
        // 步骤 2：连接到 SFU（WebSocket 信令 + WebRTC 协商）
        // ============================================================
        /**
         * 整体流程：
         * 1. 读取用户输入的房间ID、用户ID、SFU地址
         * 2. 建立与 SFU 的 WebSocket 连接（用于交换 SDP 和 ICE 候选）
         * 3. 发送 join 消息，等待 joined 确认
         * 4. joined 确认后，启动 WebRTC 协商（startWebRTC）
         * 5. 在 WebSocket 上监听 answer / ice-candidate / ssrc_mapping 等消息
         */
        async function connectToSFU() {
            const roomId = parseInt(document.getElementById('room-id').value);
            const userId = parseInt(document.getElementById('user-id').value);
            const sfuUrl = document.getElementById('sfu-url').value;

            log(`开始连接SFU: 房间=${roomId}, 用户=${userId}`);
            btnConnect.disabled = true; // 防止重复点击

            try {
                // 将 http:// 或 https:// 替换为 ws:// 或 wss://，构造 WebSocket URL
                const wsUrl = sfuUrl.replace(/^http/, 'ws') + '/ws';
                log(`连接SFU WebSocket: ${wsUrl}`);

                sfuWs = new WebSocket(wsUrl);

                // WebSocket 连接成功后的回调
                sfuWs.onopen = async () => {
                    log('SFU WebSocket已连接', 'success');

                    // 发送 join 消息：告知 SFU 要加入哪个房间，以哪个用户身份
                    sfuWs.send(JSON.stringify({
                        type: 'join',
                        room_id: roomId,
                        user_id: userId
                    }));
                };

                sfuWs.onerror = (error) => {
                    log('SFU WebSocket连接失败', 'error');
                    updateStatus('offer', 'error', '连接失败');
                    btnConnect.disabled = false;
                };

                // 处理 SFU 发来的所有信令消息
                sfuWs.onmessage = async (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        log(`收到SFU消息: ${msg.type}`);

                        switch(msg.type) {
                            // joined: SFU 已接受加入请求，可以开始 WebRTC 协商
                            case 'joined':
                                log('成功加入房间，开始WebRTC协商', 'success');
                                await startWebRTC(roomId, userId, sfuUrl);
                                break;

                            // offer: SFU 主动发来的 SDP Offer（重新协商场景）
                            // 原因：当新用户加入并上传媒体后，SFU 需要把新轨道推送给已连接用户，
                            //       此时 SFU 作为 offerer，浏览器作为 answerer 完成二次协商。
                            case 'offer':
                                log('收到SDP Offer（重新协商）', 'success');
                                if (!peerConnection) {
                                    log('错误: peerConnection为空，无法处理重新协商', 'error');
                                    return;
                                }
                                await peerConnection.setRemoteDescription({
                                    type: 'offer',
                                    sdp: msg.sdp
                                });
                                const renegotiateAnswer = await peerConnection.createAnswer();
                                await peerConnection.setLocalDescription(renegotiateAnswer);
                                if (sfuWs && sfuWs.readyState === WebSocket.OPEN) {
                                    sfuWs.send(JSON.stringify({
                                        type: 'answer',
                                        sdp: renegotiateAnswer.sdp
                                    }));
                                }
                                log('重新协商Answer已发送', 'success');
                                break;

                            // answer: SFU 回复的 SDP Answer（初次协商）
                            // 浏览器作为 offerer 发送初始 offer，SFU 回复 answer，设置后即完成初次协商
                            case 'answer':
                                log('收到SDP Answer', 'success');
                                updateStatus('answer', 'success', '已接收');
                                if (!peerConnection) {
                                    log('错误: peerConnection为空，无法设置RemoteDescription', 'error');
                                    return;
                                }
                                await peerConnection.setRemoteDescription({
                                    type: 'answer',
                                    sdp: msg.sdp
                                });
                                log('WebRTC协商完成！', 'success');
                                break;

                            // ice-candidate: SFU 发来的网络穿透候选地址，需要添加到本地 PeerConnection
                            case 'ice-candidate':
                                log('收到SFU ICE候选，添加到PeerConnection');
                                if (!peerConnection) {
                                    log('错误: peerConnection为空，无法添加ICE候选', 'error');
                                    return;
                                }
                                await peerConnection.addIceCandidate({
                                    candidate: msg.candidate,
                                    sdpMLineIndex: msg.sdp_m_line_index,
                                    sdpMid: msg.sdp_mid
                                });
                                break;

                            // ssrc_mapping: SFU 告知当前房间内已有的媒体流信息（SSRC -> 用户映射）
                            // 测试页面简化为仅记录日志，生产环境需据此将远程流归属到具体用户
                            case 'ssrc_mapping':
                                if (msg.ssrcs && Array.isArray(msg.ssrcs)) {
                                    log(`收到SSRC映射: 共${msg.ssrcs.length}条流`, 'info');
                                    msg.ssrcs.forEach(s => {
                                        log(`  SSRC=${s.ssrc} User=${s.user_id} Kind=${s.kind} Stream=${s.stream_id}`, 'info');
                                    });
                                }
                                break;

                            // error: SFU 返回的业务错误
                            case 'error':
                                log(`SFU错误: ${msg.message || msg.error}`, 'error');
                                break;

                            default:
                                log(`收到未处理的SFU消息类型: ${msg.type}`, 'warn');
                        }
                    } catch (err) {
                        log(`处理SFU消息出错: ${err.message}`, 'error');
                    }
                };

                sfuWs.onclose = () => {
                    log('SFU WebSocket已关闭');
                };

            } catch (error) {
                log(`连接SFU失败: ${error.message}`, 'error');
                updateStatus('offer', 'error', '发送失败');
                updateStatus('answer', 'error', '接收失败');
                btnConnect.disabled = false;
            }
        }

        // ============================================================
        // 启动 WebRTC（在 joined 确认后调用）
        // ============================================================
        /**
         * 核心 WebRTC 协商流程：
         * 1. 根据 SFU 地址构建 ICE 配置（STUN + TURN）
         * 2. 创建 RTCPeerConnection，绑定所有事件监听器
         * 3. 将本地媒体轨道添加到 PeerConnection（上行到 SFU）
         * 4. 创建 SDP Offer，设置本地描述，通过 WebSocket 发送给 SFU
         * 5. 等待 SFU 返回 Answer 和 ICE 候选，完成连接
         */
        async function startWebRTC(roomId, userId, sfuUrl) {
            try {
                // 创建 PeerConnection，传入动态配置的 ICE 服务器
                const pcConfig = buildRtcConfig(sfuUrl);
                peerConnection = new RTCPeerConnection(pcConfig);
                log(`PeerConnection已创建，初始ICE收集状态: ${peerConnection.iceGatheringState}`);

                // ==================== 事件监听注册 ====================

                // ontrack: 当 SFU 转发其他用户的媒体轨道给本端时触发
                peerConnection.ontrack = (event) => {
                    log(`收到远程轨道: ${event.track.kind}, ID=${event.track.id}`, 'success');
                    // 将收到的每个远程轨道添加到统一的 remoteStream 中
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                    remoteVideo.srcObject = remoteStream;
                    updateStatus('stream', 'success', '正在接收');
                };

                // onconnectionstatechange: PeerConnection 整体连接状态变化
                peerConnection.onconnectionstatechange = () => {
                    const state = peerConnection.connectionState;
                    log(`PeerConnection 连接状态: ${state}`, state === 'connected' ? 'success' : 'info');
                    if (state === 'failed') {
                        log('PeerConnection 进入 failed 状态，ICE 协商失败。请检查：1) TURN 服务器是否可达 2) 防火墙是否阻止 UDP/TCP', 'error');
                    }
                };

                // oniceconnectionstatechange: ICE 层（网络穿透）连接状态变化
                peerConnection.oniceconnectionstatechange = () => {
                    const state = peerConnection.iceConnectionState;
                    log(`ICE连接状态变化: ${state}`);
                    if (state === 'connected' || state === 'completed') {
                        updateStatus('ice', 'success', state);
                    } else if (state === 'failed' || state === 'disconnected') {
                        updateStatus('ice', 'error', state);
                    }
                };

                // onicegatheringstatechange: ICE 候选收集进度（new -> gathering -> complete）
                peerConnection.onicegatheringstatechange = () => {
                    log(`ICE收集状态变化: ${peerConnection.iceGatheringState}`);
                };

                // onicecandidate: 每当浏览器生成一个本地 ICE 候选时触发
                // 需要立即通过 WebSocket 发送给 SFU，让 SFU 知道如何连接本端
                peerConnection.onicecandidate = (event) => {
                    try {
                        if (event.candidate) {
                            const c = event.candidate;
                            const candidateStr = c.candidate || '';
                            // 解析候选类型：host(本地直连) / srflx(STUN反射) / relay(TURN中继)
                            const candidateType = candidateStr.includes('typ relay') ? 'relay' :
                                                  candidateStr.includes('typ srflx') ? 'srflx' :
                                                  candidateStr.includes('typ host') ? 'host' : 'unknown';
                            log(`本地ICE候选 [${candidateType}]: ${candidateStr.substring(0, 80)}...`);
                            if (sfuWs && sfuWs.readyState === WebSocket.OPEN) {
                                sfuWs.send(JSON.stringify({
                                    type: 'ice-candidate',
                                    candidate: c.candidate,
                                    sdp_m_line_index: c.sdpMLineIndex,
                                    sdp_mid: c.sdpMid
                                }));
                            } else {
                                log('WebSocket未打开，无法发送ICE候选', 'warn');
                            }
                        } else {
                            log('本地ICE候选收集完成', 'success');
                        }
                    } catch (err) {
                        log(`onicecandidate处理出错: ${err.message}`, 'error');
                    }
                };

                // ==================== 添加本地轨道并创建 Offer ====================

                // 将本地模拟媒体流的所有轨道添加到 PeerConnection
                // 这是"上行"数据流：从浏览器发送到 SFU
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                    log(`添加本地轨道: ${track.kind} (模拟)`);
                });

                // 创建 SDP Offer：描述本端支持的媒体格式、传输参数、ICE候选等
                log('正在创建SDP Offer...');
                const offer = await peerConnection.createOffer();
                log(`SDP Offer创建成功，类型: ${offer.type}`);

                // 设置本地描述：告诉浏览器按 Offer 中的参数准备发送/接收
                await peerConnection.setLocalDescription(offer);
                log(`setLocalDescription完成，当前ICE收集状态: ${peerConnection.iceGatheringState}`);
                updateStatus('offer', 'pending', '发送中...');

                // 通过 WebSocket 将 Offer 发送给 SFU
                if (sfuWs && sfuWs.readyState === WebSocket.OPEN) {
                    sfuWs.send(JSON.stringify({
                        type: 'offer',
                        sdp: offer.sdp
                    }));
                    updateStatus('offer', 'success', '已发送');
                    log('SDP Offer已发送到SFU');
                }

                // 5秒后检查 ICE 收集状态：如果仍未完成，提示用户排查问题
                setTimeout(() => {
                    if (peerConnection && peerConnection.iceGatheringState !== 'complete') {
                        log('警告: 5秒内未收到任何本地ICE候选。可能原因: 1) 浏览器扩展阻止WebRTC 2) 防火墙阻止TURN TCP连接 3) 请检查浏览器DevTools控制台', 'warn');
                    }
                }, 5000);

                btnDisconnect.disabled = false;
            } catch (err) {
                log(`startWebRTC出错: ${err.message}`, 'error');
                log(`错误堆栈: ${err.stack}`, 'error');
            }
        }

        // ============================================================
        // 断开连接：清理所有资源
        // ============================================================
        /**
         * 按正确顺序释放资源：
         * 1. 关闭 WebSocket（停止信令）
         * 2. 关闭 PeerConnection（停止 WebRTC 传输）
         * 3. 停止 Canvas 动画和音频振荡器（停止模拟媒体生成）
         * 4. 停止本地媒体轨道
         * 5. 重置 DOM 和状态显示
         */
        function disconnect() {
            log('断开连接...');

            if (sfuWs) {
                sfuWs.close();
                sfuWs = null;
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            // 停止 Canvas 动画
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            simCanvas = null;
            simCtx = null;

            // 停止音频上下文和振荡器
            if (audioOsc) {
                try { audioOsc.stop(); } catch (e) {}
                audioOsc = null;
            }
            if (audioCtx) {
                try { audioCtx.close(); } catch (e) {}
                audioCtx = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            remoteStream = new MediaStream();

            // 重置所有状态面板到初始值
            updateStatus('media', 'pending', '等待生成');
            updateStatus('offer', 'pending', '未发送');
            updateStatus('answer', 'pending', '未接收');
            updateStatus('ice', 'pending', '未连接');
            updateStatus('stream', 'pending', '等待中...');

            // 重新禁用连接按钮，等待用户再次"生成模拟媒体流"
            btnConnect.disabled = true;
            btnDisconnect.disabled = true;

            log('已断开连接', 'warn');
        }

        // ============================================================
        // 页面加载完成后的初始化提示
        // ============================================================
        log('SFU无摄像头测试页面加载完成');
        log('===== 使用说明 =====');
        log('1. 先开启两个浏览器窗口，都访问此页面');
        log('2. 两个窗口都点击"生成模拟媒体流"（无需摄像头权限）');
        log('3. 第一个窗口用户ID填1，第二个窗口用户ID填2');
        log('4. 两个窗口房间ID都填相同数字（比如1）');
        log('5. 依次点击"连接SFU"');
        log('6. 检查两个窗口是否都能看到对方的模拟视频');
        log('====================');
        log('提示：本地开发环境无需特殊配置，直接使用 localhost 即可');
    </script>
</body>
</html>
