# 基础编排：HTTP（本机/开发）。
#   - 局域网/公网试用需要 HTTPS（浏览器只在 localhost 或 HTTPS 页面上开放摄像头/麦克风）：
#       docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.tls.yml up -d --build
#     见 docs/LAN_DEPLOYMENT.md。
#   - 需要从宿主机直连 Postgres/Redis（本地开发、make e2e-up）时叠加 docker-compose.dev.yml。
#   - 数据库表结构由 api-server 启动时的内嵌迁移自动创建/升级。
services:
  postgres:
    image: postgres:15-alpine
    container_name: conference-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-conference}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 默认不把端口暴露到宿主机（公网机器上暴露数据库端口就是事故）；需要时叠加 docker-compose.dev.yml
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-conference}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - conference-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conference-redis
    # REDIS_PASSWORD 非空时启用密码（api-server / sfu-server 同样读取 REDIS_PASSWORD）
    command: ["sh", "-c", "exec redis-server ${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - conference-net
    restart: unless-stopped

  coturn:
    image: instrumentisto/coturn:4.6
    container_name: conference-coturn
    # REST 时限凭据（--use-auth-secret）：API 用同一个 TURN_STATIC_AUTH_SECRET 为每个用户签发短期凭据，
    # 前端不再持有固定账号密码。中继端口段 49300-49400（与 SFU 的媒体端口段错开）。
    command:
      - sh
      - -c
      - >-
        exec turnserver --log-file=stdout --fingerprint --no-cli
        --realm=${TURN_REALM:-conference}
        --use-auth-secret --static-auth-secret=$$TURN_STATIC_AUTH_SECRET
        --min-port=49300 --max-port=49400
        ${TURN_EXTERNAL_IP:+--external-ip=$$TURN_EXTERNAL_IP}
    environment:
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-dev-turn-secret-change-in-production}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49300-49400:49300-49400/udp"
    networks:
      - conference-net
    restart: unless-stopped

  api-server:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.server
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: conference-api
    environment:
      GO_ENV: ${GO_ENV:-production}
      SERVER_PORT: 8080
      SFU_PORT: 8081
      SFU_GRPC_PORT: 50051
      SFU_ADDR: sfu-server:50051
      # API 访问 SFU HTTP 接口（录制列表/下载代理）的内网地址
      SFU_HTTP_URL: http://sfu-server:8081
      # 非空时 /metrics 需要 Bearer token
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-conference}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SFU_JWT_SECRET: ${SFU_JWT_SECRET:-your-sfu-secret-key-change-in-production}
      SFU_CONTROL_TOKEN: ${SFU_CONTROL_TOKEN:-dev-sfu-control-token}
      SFU_CALLBACK_TOKEN: ${SFU_CALLBACK_TOKEN:-dev-sfu-callback-token}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-168}
      SFU_TOKEN_EXPIRY_MINUTES: ${SFU_TOKEN_EXPIRY_MINUTES:-5}
      # 下发给浏览器的 ICE 配置：TURN_URLS 指向浏览器能访问到的 coturn 地址（局域网 IP / 公网 IP）
      STUN_URLS: ${STUN_URLS:-stun:stun.qq.com:3478,stun:stun.miwifi.com:3478}
      TURN_URLS: ${TURN_URLS:-}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-dev-turn-secret-change-in-production}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      SFU_ALLOW_UNAUTHENTICATED_DEV: ${SFU_ALLOW_UNAUTHENTICATED_DEV:-false}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      PRESENCE_GRACE_SECONDS: ${PRESENCE_GRACE_SECONDS:-90}
      # 邮件（找回密码 / 邮箱验证）：默认 log 只打日志；生产配置 smtp
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      APP_NAME: ${APP_NAME:-SFU会议}
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:-10}
      HTTP_WRITE_TIMEOUT_SECONDS: ${HTTP_WRITE_TIMEOUT_SECONDS:-10}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-5}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      RATE_LIMIT_WS_PER_MINUTE: ${RATE_LIMIT_WS_PER_MINUTE:-20}
      RATE_LIMIT_SFU_WS_PER_MINUTE: ${RATE_LIMIT_SFU_WS_PER_MINUTE:-20}
      RATE_LIMIT_SFU_MSG_PER_MINUTE: ${RATE_LIMIT_SFU_MSG_PER_MINUTE:-600}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sfu-server:
        condition: service_started
    networks:
      - conference-net
    restart: unless-stopped

  sfu-server:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.sfu
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: conference-sfu
    environment:
      GO_ENV: ${GO_ENV:-production}
      SFU_PORT: 8081
      SFU_GRPC_PORT: 50051
      API_SERVER_HOST: ${API_SERVER_HOST:-http://api-server:8080}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SFU_JWT_SECRET: ${SFU_JWT_SECRET:-your-sfu-secret-key-change-in-production}
      SFU_CONTROL_TOKEN: ${SFU_CONTROL_TOKEN:-dev-sfu-control-token}
      SFU_CALLBACK_TOKEN: ${SFU_CALLBACK_TOKEN:-dev-sfu-callback-token}
      STUN_URLS: ${STUN_URLS:-stun:stun.qq.com:3478,stun:stun.miwifi.com:3478}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      SFU_ALLOW_UNAUTHENTICATED_DEV: ${SFU_ALLOW_UNAUTHENTICATED_DEV:-false}
      RATE_LIMIT_SFU_WS_PER_MINUTE: ${RATE_LIMIT_SFU_WS_PER_MINUTE:-20}
      RATE_LIMIT_SFU_MSG_PER_MINUTE: ${RATE_LIMIT_SFU_MSG_PER_MINUTE:-600}
      SFU_PUBLIC_WS_URL: ${SFU_PUBLIC_WS_URL:-ws://localhost:8081}
      SFU_RECORDING_DIR: ${SFU_RECORDING_DIR:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # 媒体 UDP 端口段：必须与下面 ports 发布的区间一致；容器外的浏览器才收得到媒体
      WEBRTC_PORT_RANGE_MIN: ${WEBRTC_PORT_RANGE_MIN:-49152}
      WEBRTC_PORT_RANGE_MAX: ${WEBRTC_PORT_RANGE_MAX:-49200}
      # SFU 对外可达的 IP（局域网：宿主机 IP；云主机：弹性公网 IP），写进 ICE host 候选
      SFU_PUBLIC_IP: ${SFU_PUBLIC_IP:-}
    ports:
      - "8081:8081"
      - "${WEBRTC_PORT_RANGE_MIN:-49152}-${WEBRTC_PORT_RANGE_MAX:-49200}:${WEBRTC_PORT_RANGE_MIN:-49152}-${WEBRTC_PORT_RANGE_MAX:-49200}/udp"
    volumes:
      - sfu_recordings:/data/recordings
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - conference-net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        VITE_API_HOST: ${VITE_API_HOST:-http://localhost:8080}
        VITE_SFU_HOST: ${VITE_SFU_HOST:-http://localhost:8081}
    container_name: conference-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-server
      - sfu-server
    networks:
      - conference-net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: conference-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-server
      - sfu-server
    networks:
      - conference-net
    restart: unless-stopped

networks:
  conference-net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  sfu_recordings:
