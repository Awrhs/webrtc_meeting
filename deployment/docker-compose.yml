version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: conference-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-conference}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # 表结构由 api-server 启动时的内嵌迁移自动创建/升级（backend/internal/db/migrations），
    # 不再挂载 init.sql：那种方式只在数据卷为空时执行一次，后续改表对已有库无效。
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - conference-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conference-redis
    ports:
      - "6379:6379"
    networks:
      - conference-net
    restart: unless-stopped

  coturn:
    image: instrumentisto/coturn:latest
    container_name: conference-coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    command:
      - turnserver
      - --log-file=stdout
      - --realm=conference
      - --user=${COTURN_USER:-username}:${COTURN_PASSWORD:-password}
      - --lt-cred-mech
    environment:
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-dev-turn-secret-change-in-production}
      TURN_USER: ${COTURN_USER:-username}
      TURN_PWD: ${COTURN_PASSWORD:-password}
    networks:
      - conference-net
    restart: unless-stopped

  api-server:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.server
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: conference-api
    environment:
      GO_ENV: ${GO_ENV:-production}
      SERVER_PORT: 8080
      SFU_PORT: 8081
      SFU_GRPC_PORT: 50051
      SFU_ADDR: sfu-server:50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-conference}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SFU_JWT_SECRET: ${SFU_JWT_SECRET:-your-sfu-secret-key-change-in-production}
      SFU_CONTROL_TOKEN: ${SFU_CONTROL_TOKEN:-dev-sfu-control-token}
      SFU_CALLBACK_TOKEN: ${SFU_CALLBACK_TOKEN:-dev-sfu-callback-token}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-168}
      SFU_TOKEN_EXPIRY_MINUTES: ${SFU_TOKEN_EXPIRY_MINUTES:-5}
      COTURN_URL: ${COTURN_URL:-turn:coturn:3478}
      COTURN_USER: ${COTURN_USER:-username}
      COTURN_PASSWORD: ${COTURN_PASSWORD:-password}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      SFU_ALLOW_UNAUTHENTICATED_DEV: ${SFU_ALLOW_UNAUTHENTICATED_DEV:-false}
      UPLOAD_DIR: /data/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-20971520}
      PRESENCE_GRACE_SECONDS: ${PRESENCE_GRACE_SECONDS:-90}
      HTTP_READ_TIMEOUT_SECONDS: ${HTTP_READ_TIMEOUT_SECONDS:-10}
      HTTP_WRITE_TIMEOUT_SECONDS: ${HTTP_WRITE_TIMEOUT_SECONDS:-10}
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-15}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-5}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-120}
      RATE_LIMIT_WS_PER_MINUTE: ${RATE_LIMIT_WS_PER_MINUTE:-20}
      RATE_LIMIT_SFU_WS_PER_MINUTE: ${RATE_LIMIT_SFU_WS_PER_MINUTE:-20}
      RATE_LIMIT_SFU_MSG_PER_MINUTE: ${RATE_LIMIT_SFU_MSG_PER_MINUTE:-600}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      - postgres
      - redis
      - sfu-server
    networks:
      - conference-net
    restart: unless-stopped

  sfu-server:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.sfu
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: conference-sfu
    environment:
      GO_ENV: ${GO_ENV:-production}
      SFU_PORT: 8081
      SFU_GRPC_PORT: 50051
      API_SERVER_HOST: ${API_SERVER_HOST:-http://api-server:8080}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SFU_JWT_SECRET: ${SFU_JWT_SECRET:-your-sfu-secret-key-change-in-production}
      SFU_CONTROL_TOKEN: ${SFU_CONTROL_TOKEN:-dev-sfu-control-token}
      SFU_CALLBACK_TOKEN: ${SFU_CALLBACK_TOKEN:-dev-sfu-callback-token}
      COTURN_URL: ${COTURN_URL:-turn:coturn:3478}
      COTURN_USER: ${COTURN_USER:-username}
      COTURN_PASSWORD: ${COTURN_PASSWORD:-password}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      SFU_ALLOW_UNAUTHENTICATED_DEV: ${SFU_ALLOW_UNAUTHENTICATED_DEV:-false}
      RATE_LIMIT_SFU_WS_PER_MINUTE: ${RATE_LIMIT_SFU_WS_PER_MINUTE:-20}
      RATE_LIMIT_SFU_MSG_PER_MINUTE: ${RATE_LIMIT_SFU_MSG_PER_MINUTE:-600}
      SFU_PUBLIC_WS_URL: ${SFU_PUBLIC_WS_URL:-ws://localhost:8081}
      SFU_RECORDING_DIR: ${SFU_RECORDING_DIR:-}
    ports:
      - "8081:8081"
    volumes:
      - sfu_recordings:/data/recordings
    depends_on:
      - postgres
      - redis
    networks:
      - conference-net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        VITE_API_HOST: ${VITE_API_HOST:-http://localhost:8080}
        VITE_SFU_HOST: ${VITE_SFU_HOST:-http://localhost:8081}
    container_name: conference-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-server
      - sfu-server
    networks:
      - conference-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: conference-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - api-server
      - sfu-server
    networks:
      - conference-net
    restart: unless-stopped

networks:
  conference-net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  sfu_recordings:
