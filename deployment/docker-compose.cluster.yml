# 多 SFU 实例集群示例（docker compose -f deployment/docker-compose.yml -f deployment/docker-compose.cluster.yml up）
#
# 两个 SFU 实例通过共享 Redis 注册心跳；API 服务器按房间亲和性
# （首个加入者选择负载最低的实例并固定房间到该实例）路由 gRPC 控制命令，
# 前端通过 join/sfu-token 响应里的 sfu_url 直连房间所在实例。
#
# 浏览器访问端口：
#   实例1 SFU WS: ws://localhost:8081
#   实例2 SFU WS: ws://localhost:8082
# 实例 gRPC 端口仅在容器网络内可达（不需要对宿主机暴露）。

version: '3.8'

services:
  sfu-server:
    # 基础服务定义保留；显式实例 ID/端口通过环境变量区分
    ports:
      - "8081:8081"
    environment:
      SFU_INSTANCE_ID: sfu-1
      SFU_GRPC_ADDR: sfu-server:50051
      SFU_GRPC_PORT: "50051"
      SFU_PUBLIC_WS_URL: ws://localhost:8081

  sfu-server-2:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.sfu
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: conference-sfu-2
    environment:
      GO_ENV: ${GO_ENV:-production}
      SFU_PORT: 8081
      SFU_GRPC_PORT: "50052"
      SFU_GRPC_ADDR: sfu-server-2:50052
      SFU_INSTANCE_ID: sfu-2
      API_SERVER_HOST: ${API_SERVER_HOST:-http://api-server:8080}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      SFU_JWT_SECRET: ${SFU_JWT_SECRET:-your-sfu-secret-key-change-in-production}
      SFU_CONTROL_TOKEN: ${SFU_CONTROL_TOKEN:-dev-sfu-control-token}
      SFU_CALLBACK_TOKEN: ${SFU_CALLBACK_TOKEN:-dev-sfu-callback-token}
      COTURN_URL: ${COTURN_URL:-turn:coturn:3478}
      COTURN_USER: ${COTURN_USER:-username}
      COTURN_PASSWORD: ${COTURN_PASSWORD:-password}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      SFU_INSTANCE_ID: sfu-2
      SFU_GRPC_ADDR: sfu-server-2:50052
      SFU_PUBLIC_WS_URL: ws://localhost:8082
      RATE_LIMIT_SFU_WS_PER_MINUTE: ${RATE_LIMIT_SFU_WS_PER_MINUTE:-20}
      RATE_LIMIT_SFU_MSG_PER_MINUTE: ${RATE_LIMIT_SFU_MSG_PER_MINUTE:-120}
    ports:
      - "8082:8081"
    # gRPC 50052 不需要暴露给宿主机；API 服务器在同一 docker 网络通过容器名:端口访问。
    # 注意：容器内 SFU_GRPC_PORT=50052，需要为该实例映射自定义监听端口。
    depends_on:
      - postgres
      - redis
    networks:
      - conference-net
    restart: unless-stopped
